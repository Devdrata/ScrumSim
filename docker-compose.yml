services:
  postgres:
    image: postgres:16-alpine
    container_name: scrumsim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrumsim
      POSTGRES_PASSWORD: scrumsim
      POSTGRES_DB: scrumsim
    ports:
      - "5432:5432"
    volumes:
      - scrumsim_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrumsim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scrumsim_postgres_data:
